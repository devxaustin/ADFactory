name: Beach art sample checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'games/monkey-island/art/beach-sample-v1/**'
      - 'games/monkey-island/tools/make_beach_sample.py'
      - 'games/monkey-island/tools/test_beach_sample.py'
      - 'games/monkey-island/tools/beach_review_template.html'
      - 'games/monkey-island/tools/beach-sample-requirements.txt'
      - '.github/workflows/beach-art-sample-validation.yml'

permissions:
  contents: read

jobs:
  validate-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: games/monkey-island
    steps:
      - name: Check out review branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install local art validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/beach-sample-requirements.txt
      - name: Validate committed exports (no private reference required)
        run: python tools/test_beach_sample.py
